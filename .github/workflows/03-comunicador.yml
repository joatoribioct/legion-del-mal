name: Comunicador de la Legión del Mal

on:
  workflow_dispatch:
    inputs:
        villano:
            description: 'Nombre del villano que enviará el mensaje?'
            required: true
            type: choice
            options:
                - Brainiac
                - Lex Luthor
                - Darkseid
                - Joker
        
        Mensaje:
            description: 'Mensaje que se enviará al villano'
            required: true
            default: 'La mision fue un exito, el plan de la fortaleza prohibida fue descubierto'
        

        Prioridad:
            description: 'Nivel de prioridad del mensaje'
            required: true
            type: choice
            options:
                - 🟢 Normal
                - 🟡 Alta
                - 🔴 Urgente


jobs:
  transmitir-mensaje:
    runs-on: ubuntu-latest

    steps:
      - name: Instalar el tranmisor de legion
        run: sudo apt-get install -y cowsay

      - name: Imprimir inputs
        run: |
          echo "========================="
          echo "Transmision intercepatada"
          echo "========================="
          echo ""
          echo "De : ${{ github.actor }}"
          echo ""
          echo "Fecha: $(date -u +"%d/%m/%Y - %H:%M UTC")"
          echo " ------ Mensaje ------"
          cowsay -f eyes "${{ inputs.Mensaje }}"
          echo ""
          echo "--- ${{ inputs.villano }} ---"
          echo "Finalizando transmision..."