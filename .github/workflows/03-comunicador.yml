name: Comunicador de la Legión del Mal

on:
  workflow_dispatch:
    inputs:
        villano:
            description: 'Nombre del villano que enviará el mensaje?'
            required: true
            type: choice
            options:
                - Brainiac
                - Lex Luthor
                - Darkseid
                - Joker
        
        Mensaje:
            description: 'Mensaje que se enviará al villano'
            required: true
            default: 'La mision fue un exito, el plan de la fortaleza prohibida fue descubierto'
        

        Prioridad:
            description: 'Nivel de prioridad del mensaje'
            required: true
            type: choice
            options:
                - 🟢 Normal
                - 🟡 Alta
                - 🔴 Urgente


jobs:
  transmitir-mensaje:
    runs-on: ubuntu-latest

    steps:
      - name: Imprimir inputs
        run: |
          echo "Inputs:"
          echo ""
          echo "Villano: ${{ inputs.villano }}"
          echo "Nivel: ${{ inputs.Prioridad }}"
          echo "mensaje: ${{ inputs.Mensaje }}"